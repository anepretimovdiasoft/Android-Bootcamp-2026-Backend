version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bootcamp-postgres
    environment:
      POSTGRES_DB: bootcamp
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bootcamp-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bootcamp
      DB_USER: bootcamp
      DB_PASSWORD: bootcamp123
    ports:
      - "8080:8080"

volumes:
  postgres_data:
