version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bunch_db}
      POSTGRES_USER: ${POSTGRES_USER:-bunch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0001}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bunch} -d ${POSTGRES_DB:-bunch_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bunch-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bunch_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bunch}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-0001}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata: