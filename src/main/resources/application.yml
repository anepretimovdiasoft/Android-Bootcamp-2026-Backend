spring:
  datasource:
    url: jdbc:h2:file:./h2-data/appdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  liquibase:
    enabled: true
    change-log: classpath:db.changelog/db.changelog-master.xml

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true

app:
  jwt:
    secret: mySecretKeyForBootcamp2026WhichIsVeryLongAndSecureEnough
    expiration-ms: 86400000
