spring:
  datasource:
    url: jdbc:h2:mem:testdb

  server:
    address: 0.0.0.0
    port: 8080

  h2:
    console:
      enabled: true

  liquibase:
    enabled: true
    change-log: classpath:db.changelog/db.changelog-master.xml

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true