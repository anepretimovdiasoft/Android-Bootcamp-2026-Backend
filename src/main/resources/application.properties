spring.application.name=bunch
server.address=localhost
server.port=8080

# DB
spring.datasource.url=jdbc:postgresql://localhost:5432/bunch_db
spring.datasource.username=bunch
spring.datasource.password=0001
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# LIQUIBASE
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=public

# LOGGING
logging.level.liquibase=debug
logging.level.org.springframework=info

# 5 minutes
jwt.access-token-expiration-ms=300000
# 7 days
jwt.refresh-token-expiration-ms=604800000

# JWT RSA keys (Resources)
jwt.private-key=classpath:keys/private.pem
jwt.public-key=classpath:keys/public.pem
