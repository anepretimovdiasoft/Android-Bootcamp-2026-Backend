services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: applicationuser
      POSTGRES_PASSWORD: gkl370WVUPMgLhK
      POSTGRES_DB: application_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U indexzero -d application_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main_network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: me@indexzero.ru
      PGADMIN_DEFAULT_PASSWORD: 06a2QnihQ3wSOqOzHRHy3imWYimp29nKFPEh7GMoMqLFFLnsck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main_network

  backend-app:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    container_name: backend-app
    ports:
      - "8080:8080"
    networks:
      - main_network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  main_network:
    external: true

volumes:
    postgres_data: